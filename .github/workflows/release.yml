# Publish on merge into release, without rebuilding: the pull request from
# staging already ran the full build (build.yml), so this takes that run's
# artifacts, signs every one (OMNIMARK_GPG_KEY), builds a signed pacman repo,
# tags the release (YYYY.MM.DD, .N for more in one day) and creates a GitHub
# Release with the packages, signatures and SHA256SUMS.
#
# Merge staging -> release pull requests with "Create a merge commit": the PR's
# head is then the merge commit's second parent, which is what this looks up.
name: release

on:
  push:
    branches: [release]

permissions:
  contents: write   # tag and release
  actions: read     # read the pull request's build run and its artifacts

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the pull request's build
        id: build
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD^2 2>/dev/null) || {
            echo "::error::$GITHUB_SHA is not a merge commit; merge staging into release with 'Create a merge commit'"
            exit 1
          }
          # The published artifacts were built from the PR head; they match
          # release only if the merge changed nothing on top of it.
          if ! git diff --quiet "$head" HEAD; then
            echo "::error::release differs from the merged staging head $head; its build would not match"
            exit 1
          fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$head" \
                  --status success --json databaseId,event \
                  -q 'map(select(.event == "pull_request")) | .[0].databaseId')
          [ -n "$run" ] || { echo "::error::no successful pull-request build for $head"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Build run $run for $head" >> "$GITHUB_STEP_SUMMARY"

      - name: Download its artifacts
        run: |
          set -euo pipefail
          for name in omnimark-appimage omnimark-arch omnimark-flatpak omnimark-windows omnimark-macos; do
            gh run download "${{ steps.build.outputs.run }}" -R "$GITHUB_REPOSITORY" -n "$name" -D dist
          done
          ls -la dist

      - name: Sign (archlinux container)
        env:
          OMNIMARK_GPG_KEY: ${{ secrets.OMNIMARK_GPG_KEY }}
        run: |
          docker run --rm -e OMNIMARK_GPG_KEY \
            -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:latest \
            scripts/ci/sign-release.sh dist
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Tag
        id: tag
        run: |
          set -euo pipefail
          base=$(date -u +%Y.%m.%d)
          tag=$base
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1)); tag=$base.$n
          done
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          for f in dist/*; do
            [ -f "$f" ] || continue
            if [ "$(stat -c %s "$f")" -lt 2147483648 ]; then
              assets+=("$f")
            else
              echo "::warning::$(basename "$f") is over GitHub's 2 GiB asset limit; not attached"
            fi
          done
          gh release create "${{ steps.tag.outputs.tag }}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Omnimark ${{ steps.tag.outputs.tag }}" \
            --generate-notes "${assets[@]}"
